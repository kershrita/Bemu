# Dimensions of every bought part that touches a printed part (version 1.5).
# Every value is {value, source, status}. Status: datasheet (a printed dimension or table),
# cad (measured from the manufacturer's STEP), standard (an ISO/DIN table), measured (caliper on
# the real part) or unverified. A mounting feature built on an unverified value fails the release
# check (docs/superpowers/specs/2026-11-19-v1_5-printable-design.md).
# Units: mm and g. Servo frame: origin on the output axis, x along the body toward the long side
# (the far end is 35.11 mm away), y across the width from the centre line, z along the output axis.
units: {length: mm, mass: g}

servo:
  model: {value: Feetech STS3215, source: docs/reference/sts3215/README.md, status: datasheet}
  variant:
    value: "12 V, 1:345, 30 kg.cm (datasheet ST-3215-C047; sold as C018). NOT the 7.4 V version"
    source: docs/reference/sts3215/seeed-ST-3215-C047-datasheet.pdf
    status: datasheet
  size:  # body length, width, height without the horns
    value: [45.22, 24.72, 35]
    source: docs/reference/sts3215/waveshare-ST3215-2D-drawing.pdf
    status: datasheet
  output_axis:  # distance of the output axis from the nearer end, and from the width centre line
    value: [10.11, 0]
    source: docs/reference/sts3215/waveshare-ST3215-2D-drawing.pdf
    status: datasheet
  drawing_heights:  # the four heights on the drawing; meaning settled in version 1.5a task 3
    value: [29, 32, 35, 37.25]
    source: docs/reference/sts3215/waveshare-ST3215-2D-drawing.pdf
    status: datasheet
  case_z_range:  # back shelf to horn-side shelf: the drawing's 32 mm, where the bracket screws seat
    value: [-25.6, 6.4]
    source: docs/reference/sts3215/feetech-ST3215-20200328.stp
    status: cad
  lid_strip_box:  # the raised lid strip above the horn-side shelf: x range, y range, z range
    value: [[9.0, 34.3], [-7.0, 7.0], [6.4, 7.5]]
    source: docs/reference/sts3215/waveshare-ST3215.step
    status: cad
  rear_boss_box:  # the rear motor-end boss below the back shelf (both models agree)
    value: [[17.4, 29.7], [-9.2, 9.2], [-27.5, -25.6]]
    source: docs/reference/sts3215/waveshare-ST3215.step
    status: cad
  rear_idler_z_range:  # the rear (second) horn disc, which stands proud of the back shelf
    value: [-27.65, -24.3]  # the models differ: -27.4 (Feetech) and -27.65 (Waveshare); the larger used
    source: docs/reference/sts3215/waveshare-ST3215.step
    status: unverified
  rear_hub_diameter:  # the fixed hub through the idler; a rear plate boss must clear it
    value: 6.0
    source: docs/reference/sts3215/feetech-ST3215-20200328.stp
    status: cad
  rear_hub_z_range:
    value: [-28.2, -27.65]
    source: docs/reference/sts3215/waveshare-ST3215.step
    status: cad
  horn_disc_diameter:  # datasheet horn drawing 19.95; the Waveshare model and 2D drawing say 19.2
    value: 19.95
    source: docs/reference/sts3215/seeed-ST-3215-C047-datasheet.pdf
    status: unverified
  horn_z_range:  # horn disc along the output axis. Feetech STEP 9.2, Waveshare STEP and the drawing 9.6:
    # the larger is used so nothing can overlap; the bosses may stand 0.4 mm short until measured
    value: [4.7, 9.6]
    source: docs/reference/sts3215/feetech-ST3215-20200328.stp
    status: unverified
  horn_circle:
    value: 19.2
    source: docs/reference/sts3215/waveshare-ST3215-2D-drawing.pdf
    status: datasheet
  horn_screw:
    value: M3x6
    source: docs/reference/sts3215/seeed-ST-3215-C047-datasheet.pdf
    status: datasheet
  horn_holes:  # 4 x M3 on a 14 mm circle, on the output face
    value:
      - {x: 7, y: 0, diameter: 2.5, thread: M3}
      - {x: -7, y: 0, diameter: 2.5, thread: M3}
      - {x: 0, y: 7, diameter: 2.5, thread: M3}
      - {x: 0, y: -7, diameter: 2.5, thread: M3}
    source: docs/reference/sts3215/waveshare-ST3215.step
    status: cad
  case_holes:  # the bracket holes in the two case faces: 4 per face (pilot hole, 3.5 mm counterbore)
    # horn face: 20.7 (x) by 20.5 (y); back face: 24.45 by 20.5, as dimensioned on the drawing.
    # Depths are from Feetech's own model (the Waveshare model draws them shallower).
    value:
      - {side: horn, x: 8.3, y: 10.25, diameter: 1.6, counterbore: 3.5, depth: 3.9, thread: unknown}
      - {side: horn, x: 8.3, y: -10.25, diameter: 1.6, counterbore: 3.5, depth: 3.9, thread: unknown}
      - {side: horn, x: 29.0, y: 10.25, diameter: 1.6, counterbore: 3.5, depth: 3.9, thread: unknown}
      - {side: horn, x: 29.0, y: -10.25, diameter: 1.6, counterbore: 3.5, depth: 3.9, thread: unknown}
      - {side: back, x: 8.3, y: 10.25, diameter: 1.6, counterbore: 3.5, depth: 4.8, thread: unknown}
      - {side: back, x: 8.3, y: -10.25, diameter: 1.6, counterbore: 3.5, depth: 4.8, thread: unknown}
      - {side: back, x: 32.75, y: 10.25, diameter: 1.6, counterbore: 3.5, depth: 4.8, thread: unknown}
      - {side: back, x: 32.75, y: -10.25, diameter: 1.6, counterbore: 3.5, depth: 4.8, thread: unknown}
    source: docs/reference/sts3215/feetech-ST3215-20200328.stp
    status: cad
  case_hole_thread:  # the datasheet does not say; a 1.6 mm pilot suggests M2. Check the screws
    # that ship with the servo, and the tolerance coupon rows, before ordering fasteners.
    value: unknown (pilot 1.6 mm, counterbore 3.5 mm)
    source: not given in the datasheet or the drawing
    status: unverified
  mass:
    value: 55
    source: docs/reference/sts3215/seeed-ST-3215-C047-datasheet.pdf
    status: datasheet

screw_m3:  # socket head cap screw, ISO 4762
  head_diameter: {value: 5.5, source: ISO 4762, status: standard}
  head_height: {value: 3.0, source: ISO 4762, status: standard}
  clearance_hole: {value: 3.4, source: ISO 273 medium series, status: standard}

screw_m2:  # the bracket holes are assumed M2 (pilot 1.6 mm) until the first servo is checked
  clearance_hole: {value: 2.4, source: ISO 273 medium series, status: standard}
  head_diameter: {value: 3.8, source: ISO 4762, status: standard}
  head_height: {value: 2.0, source: ISO 4762, status: standard}

printing:  # the tolerance coupon sets these (docs/08)
  pocket_allowance: {value: 0.2, source: docs/08 starting value until the coupon is measured, status: unverified}

nut_m3:
  across_flats: {value: 5.5, source: ISO 4032, status: standard}
  thickness: {value: 2.4, source: ISO 4032, status: standard}

insert_m3:  # heat-set insert; chosen in the purchase list (docs/reports/v1_5-purchase-list.md)
  hole_diameter: {value: 4.1, source: typical 4.0-4.2 mm; the coupon decides, status: unverified}
  length: {value: 4.0, source: top plates are 4 mm thick so the insert must be no longer; the M3 x 4 short insert is common (check the chosen listing), status: unverified}

bearing_623:
  bore: {value: 3, source: ISO 15 (623), status: standard}
  outer_diameter: {value: 10, source: ISO 15 (623), status: standard}
  width: {value: 4, source: ISO 15 (623), status: standard}

bearing_683:
  bore: {value: 3, source: ISO 15 (683), status: standard}
  outer_diameter: {value: 7, source: ISO 15 (683), status: standard}
  width: {value: 3, source: ISO 15 (683), status: standard}

raspberry_pi_5:
  board: {value: [85, 56], source: "Raspberry Pi 5 mechanical drawing, datasheets.raspberrypi.com/rpi5/raspberry-pi-5-mechanical-drawing.pdf (text lists 85 and 56; the owner has a board: caliper it)", status: unverified}
  hole_pattern: {value: [58, 49], source: "same drawing and Raspberry Pi forum thread 357946 (58 x 49 mm hole spacing); caliper the board", status: unverified}
  hole_diameter: {value: 2.7, source: "same drawing (dia 2.7 for M2.5 screws); caliper the board", status: unverified}
  hole_inset: {value: 3.5, source: "distance from a short board edge to the nearest hole centre, Raspberry Pi 5 mechanical drawing (the board hangs 23.5 mm past the far holes at the connector end); caliper the board", status: unverified}
  height: {value: 17, source: "assumed height of the tallest connectors above the board; measure the board", status: unverified}
  pilot_diameter: {value: 2.1, source: "assumed pilot hole for M2.5 self-tapping screws in PETG; the coupon decides", status: unverified}

battery:  # Ovonic 3S 5000 mAh 50C XT60 listing seen 2026-11-19 (rcdrone.top); buy locally; confirm against the pack received
  size: {value: [138, 42, 28], source: "rcdrone.top Ovonic 3S 5000 mAh 50C listing 2026-11-19 (138 x 42 x 28 mm); measure the pack bought", status: unverified}
  mass: {value: 359, source: "same listing (net weight 359 g); weigh the pack bought", status: unverified}
