# Gait defaults. Starting values from docs/07-locomotion.md; tuned in simulation.
cycle_time_s: {tripod: 1.0, ripple: 1.0, wave: 1.5}   # one full step cycle; swing 0.5 / 0.33 / 0.25 s
step_height_mm: 20
max_stride_mm: 60                  # per leg, per stance
max_linear_accel_mm_s2: 50         # how fast the commanded speed may change
max_angular_accel_rad_s2: 1.0
lift_ramp_stride_mm: 30
blend_cycles: 2.0                  # a gait change takes this many cycles of the old gait
stability_threshold_mm: 15         # below this margin the strides are scaled down
scale_fall_per_s: 4.0              # how fast that scale may fall (1.0 = full strides)
scale_rise_per_s: 1.0              # and recover
