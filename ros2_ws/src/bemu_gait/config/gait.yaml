# Gait defaults. Starting values from docs/07-locomotion.md; tuned in simulation.
cycle_time_s: {tripod: 1.0, ripple: 1.5, wave: 3.0}   # one full step cycle; every gait swings for 0.5 s
step_height_mm: 20
max_stride_mm: 60                  # per leg, per stance
max_linear_accel_mm_s2: 50         # how fast the commanded speed may change
max_angular_accel_rad_s2: 1.0
lift_ramp_stride_mm: 30
blend_cycles: 2.0                  # a gait change takes this many cycles of the old gait
stability_threshold_mm: 25         # below this margin of the feet on the ground, lifts are reduced
scale_fall_per_s: 6.0              # how fast the lift scale may fall (1.0 = full lift)
scale_rise_per_s: 1.0              # and recover
max_pose_shift_mm_s: 30            # how fast a body height or shift command is applied
max_pose_tilt_rad_s: 0.3           # and a roll, pitch or yaw command
