# Gait defaults. Starting values from docs/07-locomotion.md; tuned in simulation.
cycle_time_s: {tripod: 1.0, ripple: 0.75, wave: 0.6}   # one full step cycle
step_height_mm: 30
max_stride_mm: 60                  # per leg, per stance
max_linear_accel_mm_s2: 200        # how fast the commanded speed may change
max_angular_accel_rad_s2: 1.0
lift_ramp_stride_mm: 10            # stride at which the full step height is reached
blend_cycles: 1.0                  # a gait change takes this many cycles of the old gait
stability_threshold_mm: 15         # below this margin the strides are scaled down
